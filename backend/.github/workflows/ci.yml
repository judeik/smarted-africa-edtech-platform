name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js --config=jest.config.cjs --runInBand --forceExit
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_for_ci_only
          REFRESH_SECRET: test_refresh_secret_for_ci_only
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true
