# Render Blueprint — SmartEd Africa
# docs: https://render.com/docs/blueprint-spec
#
# USAGE:
#   1. Connect this repo on render.com/dashboard → New → Blueprint
#   2. Render will create both services and prompt for values marked sync:false
#   3. Fill every sync:false variable before the first deploy goes live
#
# SECRET VARIABLES (sync:false) are NOT stored here — set them in the dashboard.
# NON-SECRET variables (value:) are stored here and auto-deployed on git push.

services:

  # ── Backend API (Node.js + Express) ─────────────────────────────────────────
  - type: web
    name: smarted-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: frankfurt        # closest to West Africa; change to oregon for US
    plan: starter            # $7/mo — free tier spins down after 15 min inactivity
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: EMAIL_FROM
        value: no-reply@smarted.africa
      - key: SESSION_TTL_SECONDS
        value: "1800"

      # ── Secrets (set manually in Render dashboard) ───────────────────────────
      - key: MONGODB_URI
        sync: false          # MongoDB Atlas connection string
      - key: REDIS_HOST
        sync: false          # Upstash endpoint (above-tiger-xxx.upstash.io)
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false          # Upstash token
      - key: REDIS_TLS
        value: "true"        # Required for Upstash
      - key: JWT_SECRET
        sync: false          # 64-byte hex — generate with: node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
      - key: REFRESH_SECRET
        sync: false          # 64-byte hex — different from JWT_SECRET
      - key: SMTP_USER
        sync: false          # smartedafrica01@gmail.com
      - key: SMTP_PASS
        sync: false          # Gmail 16-char app password
      - key: PAYSTACK_SECRET_KEY
        sync: false          # sk_live_... or sk_test_...
      - key: PAYSTACK_PUBLIC_KEY
        sync: false          # pk_live_... or pk_test_...
      - key: FRONTEND_URL
        sync: false          # https://your-app.vercel.app  (fill after Vercel deploy)
      - key: CORS_ORIGIN
        sync: false          # same as FRONTEND_URL
      - key: CLOUDINARY_CLOUD_NAME
        sync: false          # optional — leave blank to use placeholder images
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false          # optional

  # ── AI Tutor Service (Python + FastAPI + gunicorn) ───────────────────────────
  - type: web
    name: smarted-ai
    runtime: docker
    dockerfilePath: ./AI-ML/Dockerfile
    dockerContext: ./AI-ML
    region: frankfurt
    plan: starter
    branch: main
    autoDeploy: true
    healthCheckPath: /health

    envVars:
      # PORT must be explicit — Render routes traffic to this port.
      # Gunicorn CMD uses ${PORT:-8001}, HEALTHCHECK uses same.
      - key: PORT
        value: "8001"
      - key: SESSION_TTL_SECONDS
        value: "1800"
      - key: MAX_HISTORY_TURNS
        value: "20"
      - key: MONTHLY_TOKEN_CAP
        value: "50000"
      - key: GUNICORN_WORKERS
        value: "2"           # increase to 4 on paid plan with more RAM

      # ── Secrets ──────────────────────────────────────────────────────────────
      - key: ANTHROPIC_API_KEY
        sync: false          # sk-ant-... (Anthropic Pro key)
      - key: ANTHROPIC_MODEL
        value: "claude-haiku-4-5-20251001"  # upgrade to claude-sonnet-4-6 for harder questions
      - key: CORS_ORIGINS
        sync: false          # https://your-app.vercel.app (fill after Vercel deploy)
      - key: BACKEND_URL
        sync: false          # https://smarted-backend.onrender.com (fill after backend deploys)
