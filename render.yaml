# Render Blueprint — SmartEd Africa
# Single service: Node.js backend with AI merged in (free tier)
#
# USAGE:
#   render.com/dashboard → New → Blueprint → select this repo → branch: main
#
# SECRET VARIABLES (sync:false) are NOT stored here.
# Set them in the Render dashboard when prompted.

services:
  - type: web
    name: smarted-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    region: oregon
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health

    envVars:
      # ── Non-secret (stored here, auto-deployed) ─────────────────────────────
      - key: NODE_ENV
        value: production
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: EMAIL_FROM
        value: no-reply@smarted.africa
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_TLS
        value: "true"
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: AI_SESSION_TTL
        value: "1800"
      - key: AI_MAX_HISTORY_TURNS
        value: "20"

      # ── Secrets (set in Render dashboard — never stored here) ────────────────
      - key: MONGODB_URI
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_SECRET
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false   # set to Vercel domain after frontend deploys
      - key: CORS_ORIGIN
        sync: false   # same as FRONTEND_URL
      - key: CLOUDINARY_CLOUD_NAME
        sync: false   # optional
      - key: CLOUDINARY_API_KEY
        sync: false   # optional
      - key: CLOUDINARY_API_SECRET
        sync: false   # optional
      - key: SENTRY_DSN
        sync: false   # optional
