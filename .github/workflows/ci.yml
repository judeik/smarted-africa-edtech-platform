name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    name: Backend — Test & Lint
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js --config=jest.config.cjs --runInBand --forceExit
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_ci
          REFRESH_SECRET: test_refresh_secret_ci
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Security audit
        run: npm audit --audit-level=high

  frontend-build:
    name: Frontend — TypeScript + Lint + Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build (includes PWA generation)
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5000/api/v1
          VITE_SENTRY_DSN: ''

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

      - name: Security audit
        run: npm audit --audit-level=high

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend-build]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npx playwright test e2e/landing.spec.ts e2e/auth.spec.ts e2e/ai-chat.spec.ts e2e/accessibility.spec.ts
        env:
          VITE_API_URL: http://localhost:5000/api/v1

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend
        run: docker build -t smarted-backend:ci ./backend

      - name: Build frontend
        run: |
          docker build \
            --build-arg VITE_API_URL=http://localhost:5000/api/v1 \
            -t smarted-frontend:ci ./frontend
